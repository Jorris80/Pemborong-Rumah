<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D3A5F">
<meta name="description" content="Housing Contractor ERP — RAB, pengadaan, gudang, lapangan, keuangan, QC per kavling.">
<title>Housing Contractor ERP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --ink:#1D3A5F; --ink-2:#2B4F7A; --ink-soft:#DCE5F0;
  --bg:#E4E7EA; --surface:#FFFFFF; --surface-2:#F3F5F7; --line:#CDD3D9;
  --text:#18222D; --muted:#5B6773;
  --hivis:#F2A900; --hivis-ink:#3A2A00; --hivis-soft:#FFF3CF;
  --ok:#2F7D5B; --ok-soft:#DDF0E6; --bad:#B4432A; --bad-soft:#F8E1DA; --warn:#A86A00; --warn-soft:#FBEED2; --info:#2B4F7A; --info-soft:#DCE5F0;
  --radius:10px; --radius-sm:6px;
  --font-head:"Bahnschrift","DIN Alternate","DIN Next","Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --shadow:0 1px 2px rgba(20,35,55,.08),0 4px 14px rgba(20,35,55,.06);
  --nav-w:248px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#0F2440; --ink-2:#2C5585; --ink-soft:#1D3553;
  --bg:#0D1826; --surface:#152337; --surface-2:#1B2C43; --line:#2B3E57;
  --text:#E6ECF2; --muted:#9AA8B8;
  --hivis:#F5B82E; --hivis-ink:#2B1F00; --hivis-soft:#3A2F12;
  --ok:#5CC08F; --ok-soft:#173A2B; --bad:#E57A5E; --bad-soft:#40211A; --warn:#E6B04A; --warn-soft:#3A2D12; --info:#8FB4E0; --info-soft:#1D3553;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#0F2440; --ink-2:#2C5585; --ink-soft:#1D3553;
  --bg:#0D1826; --surface:#152337; --surface-2:#1B2C43; --line:#2B3E57;
  --text:#E6ECF2; --muted:#9AA8B8;
  --hivis:#F5B82E; --hivis-ink:#2B1F00; --hivis-soft:#3A2F12;
  --ok:#5CC08F; --ok-soft:#173A2B; --bad:#E57A5E; --bad-soft:#40211A; --warn:#E6B04A; --warn-soft:#3A2D12; --info:#8FB4E0; --info-soft:#1D3553;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:600;margin:0;letter-spacing:.01em;line-height:1.2}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
a{color:var(--ink-2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hivis);outline-offset:2px}
.num,td.n,.money{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.76rem}
.hide{display:none!important}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.stack{display:flex;flex-direction:column;gap:.75rem}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100vh}
.side{background:var(--ink);color:#E9EFF6;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{padding:18px 18px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{width:34px;height:34px;border-radius:7px;background:var(--hivis);color:var(--hivis-ink);display:grid;place-items:center;font:700 15px var(--font-head)}
.brand b{font-family:var(--font-head);font-size:1.02rem;display:block}
.brand span{font-size:.75rem;opacity:.7}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#D5DFEA;text-decoration:none;font-size:.93rem}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:rgba(242,169,0,.16);color:#fff;box-shadow:inset 3px 0 0 var(--hivis)}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;padding:12px 16px;font-size:.78rem;opacity:.8;border-top:1px solid rgba(255,255,255,.08)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:10px 20px}
.topbar select{max-width:340px}
.content{padding:20px;max-width:1440px;width:100%}
.netpill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.netpill i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.netpill.off i{background:var(--bad)} .netpill.sync i{background:var(--hivis)}
.iconbtn{background:none;border:1px solid transparent;border-radius:8px;padding:6px;cursor:pointer;display:inline-grid;place-items:center;color:inherit}
.iconbtn:hover{background:var(--surface-2);border-color:var(--line)}
.iconbtn svg{width:20px;height:20px}
.bottomnav{display:none}

/* ---------- Papan proyek (elemen khas) ---------- */
.board{position:relative;background:var(--ink);color:#fff;border-radius:var(--radius);padding:18px 20px 18px 28px;overflow:hidden;margin-bottom:18px}
.board::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:repeating-linear-gradient(-45deg,var(--hivis) 0 10px,#1A2533 10px 20px)}
.board h1{font-size:clamp(1.35rem,2.6vw,2rem);letter-spacing:.015em}
.board .code{font-family:var(--font-head);font-size:.95rem;color:var(--hivis);letter-spacing:.06em}
.board .meta{opacity:.82;font-size:.9rem;margin-top:2px}
.board-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:end}
.gauge{display:flex;flex-direction:column;gap:6px}
.gauge .bar{height:12px;background:rgba(255,255,255,.14);border-radius:6px;position:relative;overflow:hidden}
.gauge .bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--hivis);border-radius:6px}
.gauge .bar .plan{position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff;border-radius:2px}
.gauge .lbl{display:flex;justify-content:space-between;font-size:.82rem;opacity:.9}
.gauge .big{font-family:var(--font-head);font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}

/* ---------- Komponen ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h2,.panel-h h3{margin-right:auto}
.grid{display:grid;gap:14px;align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.kpi{background:var(--surface);padding:12px 14px;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.kpi .k{font-size:.8rem;color:var(--muted)}
.kpi .v{font-family:var(--font-head);font-size:1.32rem;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.78rem;color:var(--muted)}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:550;font-size:.92rem;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--hivis);border-color:var(--hivis);color:var(--hivis-ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:550}
.tabs button.active{color:var(--text);border-bottom-color:var(--hivis)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;font-weight:550}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.badge{background:var(--hivis);color:var(--hivis-ink);font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.progress{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.progress>div{height:100%;background:var(--ok)}
.progress.warn>div{background:var(--hivis)} .progress.bad>div{background:var(--bad)}

/* ---------- Tabel ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-weight:600;color:var(--muted);background:var(--surface-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:.82rem}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .acts{white-space:nowrap;text-align:right}
.tbl .acts .btn{margin-left:4px}
.tbl tr.neg td{color:var(--bad)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px;font-weight:600}

/* ---------- Kavling ---------- */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.unit:hover{border-color:var(--ink-2)}
.unit .no{font-family:var(--font-head);font-size:1.35rem;line-height:1}
.unit .t{font-size:.82rem;color:var(--muted)}
.unit .foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;font-size:.8rem;color:var(--muted)}
.unit .foot span{white-space:nowrap}

/* ---------- Jejak dokumen ---------- */
.trace{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;counter-reset:t}
.trace .st{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);position:relative}
.trace .st .n{font-family:var(--font-head);font-size:.8rem;color:var(--muted)}
.trace .st .d{font-size:.8rem;overflow-wrap:anywhere;font-weight:600}
.trace .st.miss{background:var(--surface-2);border-style:dashed}
.trace .st.miss .d{color:var(--muted);font-weight:400}
.trace .st.done{box-shadow:inset 0 3px 0 var(--ok)}

/* ---------- Peringatan ---------- */
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:.9rem;border-left:4px solid var(--info)}
.alert.warn{border-left-color:var(--hivis)} .alert.danger{border-left-color:var(--bad)}

/* ---------- Grafik ---------- */
.chart svg{width:100%;height:auto;display:block}
.chart .legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.chart .legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}

/* ---------- Form & modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,32,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:90vh}
.modal.wide{max-width:960px}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{margin-right:auto}
.modal-b{padding:16px 18px;overflow:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:.84rem;font-weight:600}
.field .help{font-size:.78rem;color:var(--muted)}
.field input,.field select,.field textarea,.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:40px}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{border-color:var(--ink-2);outline:2px solid var(--ink-soft)}
.field.check{flex-direction:row;align-items:center;gap:8px}
.field.check input{width:20px;height:20px;min-height:0}
.req{color:var(--bad)}
.err-box{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:.9rem}
.rows-ed table{width:100%;border-collapse:collapse;font-size:.88rem}
.rows-ed td{padding:3px}
.rows-ed input,.rows-ed select{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--surface);min-height:34px}
.photo-btn{position:relative;display:inline-flex;align-self:flex-start}
.photo-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.photo-prev{display:block;margin-top:8px;max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--line)}
.toasts{position:fixed;right:16px;bottom:16px;z-index:70;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:.9rem;border-left:4px solid var(--hivis)}
.toast.err{border-left-color:var(--bad)} .toast.ok{border-left-color:var(--ok)}
.drawer-bg{position:fixed;inset:0;background:rgba(10,20,32,.45);z-index:45}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--hivis);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-full{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
.dsr{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.dsr:last-child{border-bottom:0}
.dsr img{width:120px;height:90px;object-fit:cover;border-radius:6px;background:var(--surface-2)}
.dsr .ph{width:120px;height:90px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:.75rem;text-align:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.gantt{display:grid;gap:6px}
.gantt .gr{display:grid;grid-template-columns:200px 1fr;gap:10px;align-items:center;font-size:.85rem}
.gantt .track{position:relative;height:18px;background:var(--surface-2);border-radius:4px}
.gantt .track .pl{position:absolute;top:3px;bottom:3px;background:var(--ink-soft);border:1px solid var(--ink-2);border-radius:3px}
.gantt .track .ac{position:absolute;top:6px;bottom:6px;background:var(--hivis);border-radius:2px}
.gantt .track .today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:var(--ink);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(-45deg,var(--hivis) 0 14px,#1A2533 14px 28px)}
.login-art h1{font-size:clamp(2rem,4vw,3.2rem);max-width:12ch;line-height:1.05}
.login-art p{max-width:46ch;opacity:.85}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px 20px;background:var(--surface)}
.login-form form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.blueprint{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}

/* ---------- Print ---------- */
#print-root{display:none}
@media print{
  body{background:#fff;color:#000}
  #app,.toasts,.modal-bg{display:none!important}
  #print-root{display:block}
  .doc{font:11pt/1.45 "Times New Roman",serif;color:#000;padding:0}
  .doc h1{font:700 15pt Arial,sans-serif;margin:0}
  .doc h2{font:700 12.5pt Arial,sans-serif;text-align:center;text-decoration:underline;margin:14px 0 4px}
  .doc .hdr{border-bottom:3px double #000;padding-bottom:6px;margin-bottom:10px}
  .doc table{width:100%;border-collapse:collapse;margin:8px 0}
  .doc td,.doc th{border:1px solid #000;padding:4px 6px;font-size:10pt;text-align:left}
  .doc .r{text-align:right}
  .doc .sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px;text-align:center}
  .doc .sign div{min-height:110px;display:flex;flex-direction:column;justify-content:space-between}
  @page{size:A4;margin:16mm}
}


/* ---------- Denah & brosur ---------- */
.modal.full{max-width:1320px;height:92vh;max-height:92vh}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;flex:1;min-height:0}
.ed-canvas{background:#DDE2E7;overflow:auto;padding:12px;display:flex;align-items:flex-start;justify-content:center;min-height:0}
.ed-canvas svg{width:100%;max-width:100%;height:auto;max-height:calc(92vh - 150px);background:#fff;box-shadow:var(--shadow);touch-action:none;user-select:none}
.ed-side{border-left:1px solid var(--line);overflow:auto;padding:14px 16px;min-height:0}
.ed-side .form{grid-template-columns:1fr 1fr}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.plan-thumb{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;height:230px;display:flex;justify-content:center}
.plan-thumb svg{height:100%;width:auto;max-width:100%}
.plan-thumb.big{height:auto}.plan-thumb.big svg{height:auto;width:100%}
.br-thumb{height:160px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.br-thumb svg,.br-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.br-preview{flex:1;overflow:auto;background:#7A8591;padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:0}
.br-preview .br-page{box-shadow:0 6px 24px rgba(0,0,0,.35);flex:none}
.br-preview .brochure{display:flex;flex-direction:column;align-items:center;gap:16px}
@media (max-width:860px){
  .modal.full{height:96vh;max-height:96vh}
  .ed{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}
  .ed-canvas{padding:6px}
  .ed-canvas svg{max-height:58vh}
  .ed-side{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .cards-grid{grid-template-columns:1fr}
  .modal.full .modal-h{flex-wrap:wrap}
  #edHint{display:none}
}

/* ---------- Kinerja, versi & legal ---------- */
html.busy::before{content:"";position:fixed;left:0;top:0;height:3px;width:40%;background:var(--hivis);z-index:90;animation:busybar 1.1s ease-in-out infinite}
@keyframes busybar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.side-link{color:#D5DFEA;text-decoration:underline;text-underline-offset:2px}
.new-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:200px;border:2px dashed var(--line);background:transparent;box-shadow:none;cursor:pointer;color:var(--text)}
.new-tile:hover{border-color:var(--hivis);background:var(--hivis-soft)}
.new-tile svg{width:28px;height:28px}
.howto{background:var(--surface-2);border-left:4px solid var(--hivis);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:.92rem}
.howto ol{margin:6px 0 0;padding-left:20px}
.legal{max-width:78ch;font-size:.92rem;line-height:1.6}
.legal h3{margin:14px 0 6px}
.legal ul{padding-left:20px;margin:4px 0 8px}
.legal-box{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 14px;background:var(--surface-2)}
@media (prefers-reduced-motion:reduce){html.busy::before{animation:none;width:100%;opacity:.6}}

/* ---------- Portal pemilik rumah ---------- */
.pt-login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--ink) 0 38%,var(--bg) 38%)}
.pt-login-card{width:100%;max-width:420px;background:var(--surface);border-radius:14px;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.pt-shell{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.pt-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--ink);color:#fff}
.iconbtn.light{color:#fff}
.ellip{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-main{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.pt-main h2,.pt-main h3{margin:0}
.pt-ring{width:120px;height:120px;flex:0 0 120px}
.pt-cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;cursor:zoom-in;background:var(--surface-2)}
.pt-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.pt-steps li{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--muted);position:relative}
.pt-steps li i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:0 0 14px}
.pt-steps li.done{color:var(--text)} .pt-steps li.done i{background:var(--ok);border-color:var(--ok)}
.pt-steps li.now{color:var(--text);font-weight:650} .pt-steps li.now i{background:var(--hivis);border-color:var(--hivis);box-shadow:0 0 0 4px var(--hivis-soft)}
.pt-steps.mini{flex-direction:row;gap:12px;margin:4px 0} .pt-steps.mini li{padding:0;font-size:.8rem}
.pt-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pt-line:last-child{border-bottom:0}
.pt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pt-grid figure{margin:0;background:var(--surface-2);border-radius:10px;overflow:hidden}
.pt-grid img,.pt-grid .ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in}
.pt-grid .ph{display:grid;place-items:center;color:var(--muted);font-size:.85rem}
.pt-grid figcaption{padding:6px 8px;font-size:.8rem;line-height:1.35}
.pt-inv{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.pt-inv:last-child{border-bottom:0} .pt-inv .progress{margin-top:6px}
.pt-kpis{grid-template-columns:repeat(2,1fr)}
.pt-bank{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:10px;padding:12px}
.pt-claim{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)} .pt-claim:last-child{border-bottom:0}
.pt-claim img{width:84px;height:84px;object-fit:cover;border-radius:8px;cursor:zoom-in;flex:0 0 84px}
.pt-plan svg{width:100%;height:auto;max-height:70vh}
.pt-nav{display:grid!important;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:0 auto;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.pt-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:8px}
.pt-nav a svg{width:22px;height:22px}
.pt-nav a.active{color:var(--text);background:var(--hivis-soft)}
img.thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;vertical-align:middle;cursor:zoom-in}
pre.msg{white-space:pre-wrap;font:inherit;font-size:.88rem;background:var(--surface-2);padding:10px;border-radius:8px;margin:6px 0 0}

/* ---------- Mode Lapangan ---------- */
.fm-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:var(--radius);margin-bottom:12px;color:#fff;background:var(--ok)}
.fm-status.off{background:#7A4B00}
.fm-list{display:flex;flex-direction:column}
.fm-row{display:grid;grid-template-columns:1fr auto 86px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.fm-name{display:flex;flex-direction:column;min-width:0}
.fm-name .q{color:#9A6400;font-weight:600} .fm-name .f{color:var(--bad);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-width:42px;min-height:42px;border:0;border-right:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;color:var(--text)}
.seg button:last-child{border-right:0}
.seg button.on.s-HADIR{background:var(--ok);color:#fff} .seg button.on.s-SETENGAH{background:#3E7CB1;color:#fff}
.seg button.on.s-IZIN,.seg button.on.s-SAKIT{background:var(--hivis);color:var(--hivis-ink)} .seg button.on.s-ALPA{background:var(--bad);color:#fff}
.fm-ot{display:flex;flex-direction:column} .fm-ot input{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--text)}
@media (max-width:560px){.fm-row{grid-template-columns:1fr 78px}.fm-row .seg{grid-column:1/-1;order:3;width:100%}.seg button{flex:1}}

/* ---------- Responsif ---------- */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(84vw,300px);transform:translateX(-102%);transition:transform .22s ease;z-index:60}
  .side.open{transform:none}
  .topbar{padding:8px 12px}
  .content{padding:12px 12px 90px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .board-grid{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:8px}
  .bottomnav a svg{width:22px;height:22px}
  .bottomnav a.active{color:var(--text);background:var(--hivis-soft)}
  .modal-bg{padding:0;align-items:flex-end}
  .modal{max-height:94vh;border-radius:14px 14px 0 0}
  .toasts{left:12px;right:12px;bottom:80px;max-width:none}
  /* tabel → kartu */
  .tbl-wrap.cards{border:0;overflow:visible}
  .tbl-wrap.cards table,.tbl-wrap.cards tbody,.tbl-wrap.cards tr,.tbl-wrap.cards td{display:block;width:100%}
  .tbl-wrap.cards thead{display:none}
  .tbl-wrap.cards tr{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 4px}
  .tbl-wrap.cards td{border:0;padding:4px 10px;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .tbl-wrap.cards td::before{content:attr(data-l);color:var(--muted);font-size:.8rem;text-align:left;flex:none;max-width:45%}
  .tbl-wrap.cards td.acts{justify-content:flex-end;flex-wrap:wrap;gap:6px}
  .tbl-wrap.cards td.acts::before{display:none}
  .tbl-wrap.cards td.first{font-weight:650;display:block;text-align:left}
  .tbl-wrap.cards td.first::before{display:none}
  .login{grid-template-columns:1fr}
  .login-art{padding:28px 20px 40px;min-height:auto}
  .login-art h1{font-size:2rem}
  .gantt .gr{grid-template-columns:1fr}
  .dsr{grid-template-columns:90px 1fr}.dsr img,.dsr .ph{width:90px;height:70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------------- Data ---------------- */
/** Muat data: tampilkan salinan tersimpan seketika (bila ada), lalu perbarui dari server di latar */
function loadData(projectId, silent) {
  var pid = projectId || S.projectId || '', uid = lsGet('hc_uid');
  var fetchFresh = function (showedCache) {
    if (showedCache) S.refreshing = true, updateNet();
    else if (!silent && $('#content')) $('#content').innerHTML = '<div class="loading-full"><div class="spinner" aria-label="Memuat"></div></div>';
    return call('bootstrap', { projectId: pid }).then(function (d) { S.refreshing = false; applyBoot(d); }).catch(function (e) {
      S.refreshing = false; updateNet();
      if (!(e instanceof NetError)) throw e;
      S.online = false; updateNet();
      if (showedCache) { toast('Offline: menampilkan data tersimpan ' + dtt(S.d.serverTime) + '.'); return; }
      return Store.get('kv', 'boot:last').then(function (d) {
        if (!d) { $('#app').innerHTML = '<div class="loading-full"><div class="empty"><b>Tidak ada koneksi dan belum ada data tersimpan</b>Buka aplikasi sekali saat online agar data proyek tersimpan untuk mode offline.<br><br><button class="btn" onclick="location.reload()">Coba lagi</button></div></div>'; return; }
        S.d = d; S.fromCache = true; S.projectId = d.activeProjectId; renderShell(); toast('Mode offline: menampilkan data tersimpan ' + dtt(d.serverTime) + '.');
      });
    });
  };
  if (silent || !uid) return fetchFresh(false);
  return Store.get('kv', 'boot:' + uid + ':' + pid).then(function (c) {
    if (!c && !pid) return Store.get('kv', 'boot:last');
    return c;
  }).then(function (c) {
    if (c && c.actor && c.actor.id === uid && (!pid || c.activeProjectId === pid)) {
      S.d = c; S.fromCache = false; S.projectId = c.activeProjectId; renderShell();
      return fetchFresh(true);
    }
    return fetchFresh(false);
  });
}
function refresh() { return loadData(S.projectId, true); }
/** jalankan mutasi; server mengembalikan data terbaru dalam respons yang sama */
function doMutate(action, payload, okMsg) {
  return mutate(action, payload, okMsg).then(function (r) {
    if (r && r.queued) return r;
    if (S.lastBoot) { var b = S.lastBoot; S.lastBoot = null; applyBoot(b); return r; }
    return refresh().then(function () { return r; });
  });
}

/* ---------------- Versi & pembaruan otomatis PWA ---------------- */
function cmpVer(a, b) { a = String(a).split('.').map(Number); b = String(b).split('.').map(Number); for (var i = 0; i < 3; i++) { var x = (a[i] || 0) - (b[i] || 0); if (x) return x > 0 ? 1 : -1; } return 0; }
/** Hapus cache & service worker lama lalu muat ulang tanpa cache browser (data antrean offline di IndexedDB tetap aman) */
function hardUpdate() {
  var p = [];
  try { if ('serviceWorker' in navigator) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) { }
  try { if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) { }
  Promise.all(p).catch(function () { }).then(function () { location.replace(location.pathname + '?v=' + Date.now() + location.hash); });
}
ACT['app-update'] = function () { toast('Memperbarui aplikasi…'); hardUpdate(); };
/**
 * Bandingkan versi tampilan (file di perangkat/GitHub) dengan versi server.
 * PWA: bila server lebih baru, perangkat otomatis memuat ulang versi terbaru sekali per sesi; bila masih sama, tampilkan petunjuk.
 */
function versionBanner(sv, isAdmin) {
  var cv = CONFIG.APP_VERSION;
  if (!sv || sv === cv) return '';
  var newer = cmpVer(sv, cv) > 0, key = 'hc_upd_' + sv, tried = false;
  if (!IS_GAS && newer) {
    try { tried = sessionStorage.getItem(key); if (!tried) sessionStorage.setItem(key, '1'); } catch (e) { tried = true; }
    if (!tried) { setTimeout(hardUpdate, 50); return 'Memperbarui aplikasi ke versi ' + esc(sv) + '…'; }
  }
  if (newer) return 'Aplikasi di perangkat ini versi ' + esc(cv) + ', server sudah ' + esc(sv) + '. ' + (IS_GAS ? 'Admin perlu mengganti Index.html lalu membuat versi deployment baru.' : '<button class="btn sm" data-act="app-update">Perbarui sekarang</button> Bila tetap ' + esc(cv) + ', berkas <b>index.html</b> & <b>sw.js</b> di GitHub belum diganti dengan versi ' + esc(sv) + '.') + (isAdmin ? ' <a href="#/admin/about">Cara memperbarui</a>.' : '');
  return isAdmin ? 'Server masih versi ' + esc(sv) + ', aplikasi sudah ' + esc(cv) + '. Ganti <b>semua</b> file .gs di Apps Script, jalankan setup, lalu buat versi deployment baru. <a href="#/admin/about">Cara memperbarui</a>.' : '';
}

    ['Rekening di pesan', s.bankAccountNo ? esc(s.bankName + ' ' + s.bankAccountNo) : chip('REJECTED', 'Belum diisi')],
    ['Tautan portal', s.appUrl ? esc(s.appUrl) : chip('REJECTED', 'Belum diisi')],
    ['Direktur Proyek', (d.directors || []).length ? (d.directors || []).map(function (r) { return esc(r.name) + (r.phone ? ' (WA ' + r.phone + ')' : '') + (r.email ? ' (' + esc(r.email) + ')' : ''); }).join(', ') : chip('REJECTED', 'Belum ada — tambah pengguna berperan Direktur Proyek')]];
  return '<div class="kpis">' + kpi('Terkirim', String(cnt('SENT')), '150 log terakhir', 'ok') + kpi('Gagal', String(cnt('FAILED')), '', cnt('FAILED') ? 'bad' : '') + kpi('Dilewati', String(cnt('SKIPPED')), 'belum dikonfigurasi / nomor kosong') + '</div>' +
    '<div class="grid g2" style="align-items:start">' + panel('Konfigurasi', '<dl class="kv">' + cfg.map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>'; }).join('') + '</dl>', can('COMPANY_MANAGE') ? btn('settings-edit', 'Ubah pengaturan') + btn('notify-test', 'Kirim tes') : '') +
    panel('Yang dikirim otomatis', '<ul class="small" style="margin:0;padding-left:18px"><li><b>Pengingat jatuh tempo termin</b> ke WhatsApp/email konsumen (bukan tagihan bank KPR), tiap hari pada jam pengiriman; tiap tagihan+hari hanya sekali.</li><li><b>Perlu persetujuan</b> ke Direktur Proyek saat ada MR, revisi RAB, atau opname baru — berisi ringkasan & tautan.</li><li><b>Tanda terima pembayaran</b> ke konsumen saat pembayaran dibukukan atau mutasi bank dicocokkan.</li><li><b>Klaim garansi</b>: tanda terima & kabar perbaikan ke pemilik rumah.</li><li>Pemohon MR diberi tahu saat disetujui/ditolak.</li></ul>') + '</div><div style="height:12px"></div>' +
    panel('Log notifikasi', table([{ l: 'Waktu', f: function (x) { return dtt(x.createdAt); } }, { l: 'Jenis', f: function (x) { return esc(NK[x.kind] || x.kind) + '<br><span class="small muted">' + esc(x.channel === 'WA' ? 'WhatsApp' : 'Email') + (x.refNo ? ' · ' + esc(x.refNo) : '') + '</span>'; } }, { l: 'Penerima', f: function (x) { return esc(x.recipientName || '') + '<br><span class="small muted">' + esc(x.recipient) + '</span>'; } }, { l: 'Status', f: function (x) { return chip(x.status === 'SENT' ? 'APPROVED' : x.status === 'FAILED' ? 'REJECTED' : 'SUBMITTED', x.status === 'SENT' ? 'Terkirim' : x.status === 'FAILED' ? 'Gagal' : 'Dilewati') + (x.status !== 'SENT' ? '<br><span class="small muted">' + esc(x.detail) + '</span>' : ''); } }], list, { empty: 'Belum ada notifikasi', actions: function (x) { return btn('notif-view', 'Isi', 'data-id="' + x.id + '"'); } }));
}
ACT['notif-view'] = function (el) { var x = (S.d.notifications || []).filter(function (y) { return y.id === el.dataset.id; })[0]; showInfo(NK[x.kind] || x.kind, '<pre class="msg">' + esc(x.message) + '</pre>'); };
ACT['rem-preview'] = function () {
  call('notify.reminders', { projectId: S.projectId, dryRun: true }).then(function (r) {
    showInfo('Pengingat yang akan dikirim hari ini', (r.messages.length ? r.messages.map(function (m) { return '<div class="panel" style="margin-bottom:8px"><div class="small muted">' + (m.channel === 'WA' ? 'WhatsApp ' : 'Email ') + esc(m.to) + ' · ' + esc(m.invoiceNumber) + '</div><pre class="msg">' + esc(m.text) + '</pre></div>'; }).join('') : '<p>Tidak ada pengingat terjadwal hari ini (atau semua sudah terkirim).</p>') +
      (r.skipped.length ? '<p class="small" style="color:var(--bad)">Dilewati: ' + r.skipped.map(function (x) { return esc(x.invoiceNumber + ' — ' + x.reason); }).join('; ') + '</p>' : '') + (r.staffLines.length ? '<p class="small muted">Tagihan bank KPR (ringkasan ke staf): ' + r.staffLines.map(esc).join('; ') + '</p>' : ''), true);
  }).catch(function (e) { toast(errMsg(e), 'err'); });
};
ACT['rem-run'] = function () { confirmBox('Kirim pengingat', '<p>Kirim semua pengingat jatuh tempo yang terjadwal hari ini sekarang? Pengingat yang sudah terkirim hari ini tidak dikirim ulang.</p>', 'Kirim', function () { return call('notify.reminders', { projectId: S.projectId }).then(function (r) { toast(r.sent + ' pesan terkirim.', r.sent ? 'ok' : ''); return refresh(); }); }); };
ACT['inv-remind'] = function (el) {
  var i = byId(S.d.invoices)[el.dataset.id];
  confirmBox('Ingatkan konsumen', '<p>Kirim pengingat ' + esc(i.invoiceNumber) + ' (' + esc(i.sourceDocNumber || '') + ', sisa ' + rp(n(i.netAmount) - n(i.paidAmount)) + ', jatuh tempo ' + dt(i.dueDate) + ') ke WhatsApp/email pemilik kavling sekarang?</p>', 'Kirim', function () {
    return call('notify.reminders', { invoiceId: i.id }).then(function (r) { toast('Pengingat terkirim (' + r.sent + ' pesan).', 'ok'); return refresh(); });
  });
};

/* ---------- Impor mutasi rekening ---------- */
var BANK = { rows: [], res: null };
function bankHtml() {
  var res = BANK.res;
  var head = panel('Impor mutasi rekening', '<p class="small" style="margin-top:0">Unduh mutasi rekening dari internet banking (CSV/Excel → simpan sebagai CSV), lalu pilih berkasnya. Sistem mencocokkan dana masuk dengan tagihan konsumen/KPR yang terbuka berdasarkan <b>nomor tagihan di berita transfer</b>, nomor kavling, nama pembeli, dan nominal. Pasangan yang Anda setujui dibukukan sebagai pembayaran yang sudah direkonsiliasi, dan konsumen menerima tanda terima.</p>' +
    '<div class="row"><span class="btn photo-btn">' + ico('download') + ' Pilih berkas CSV<input type="file" accept=".csv,text/csv,text/plain" id="bankFile" aria-label="Berkas mutasi CSV"></span><span class="small muted">Kolom dikenali otomatis: tanggal, keterangan/berita, kredit/jumlah, referensi.</span></div>' +
    (BANK.rows.length && !res ? '<p class="small">' + BANK.rows.length + ' baris terbaca.</p>' : ''));
  if (!res) return head;
  var good = res.filter(function (r) { return r.match && r.score >= 50; });
  return head + '<div style="height:12px"></div>' + panel('Hasil pencocokan', '<p class="small muted" style="margin-top:0">' + good.length + ' cocok yakin, ' + res.filter(function (r) { return r.match && r.score < 50; }).length + ' perlu dicek, ' + res.filter(function (r) { return !r.match; }).length + ' tidak cocok/dilewati.</p>' +
    table([{ l: '', f: function (r) { return r.match ? '<input type="checkbox" class="bankPick" value="' + r.row + '"' + (r.score >= 50 ? ' checked' : '') + ' aria-label="Pilih baris ' + (r.row + 1) + '">' : ''; } },
      { l: 'Mutasi', f: function (r) { return '<b>' + rp(r.amount) + '</b> <span class="small muted">' + esc(r.date) + '</span><br><span class="small">' + esc(r.description) + '</span><br><span class="tiny muted">Ref ' + esc(r.reference) + '</span>'; } },
      { l: 'Tagihan', f: function (r) { return r.match ? '<b>' + esc(r.match.invoiceNumber) + '</b><br><span class="small">' + esc(r.match.label || '') + ' · ' + esc(r.match.unitNumber) + ' · ' + esc(r.match.buyerName) + '</span><br><span class="small muted">sisa ' + rp(r.match.open) + (r.match.partial ? ' (bayar sebagian)' : '') + '</span>' : '—'; } },
      { l: 'Keyakinan', f: function (r) { return r.match ? chip(r.score >= 80 ? 'APPROVED' : r.score >= 50 ? 'SUBMITTED' : 'REJECTED', r.score + '%') + '<br><span class="small muted">' + esc(r.reason) + '</span>' : '<span class="small muted">' + esc(r.reason) + '</span>'; } }], res, { cards: false }) +
    '<div class="row" style="margin-top:10px"><label class="row small" style="gap:6px"><input type="checkbox" id="bankNotify" checked> Kirim tanda terima ke konsumen</label><span class="grow"></span>' + btn('bank-reset', 'Ulangi') + btn('bank-apply', 'Bukukan yang dipilih', '', 'primary') + '</div>');
}
function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  var first = text.split(/\r?\n/)[0] || '', sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : (first.indexOf('\t') >= 0 ? '\t' : ',');
  var rows = [], cur = [], f = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === sep) { cur.push(f); f = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; cur.push(f); rows.push(cur); cur = []; f = ''; } else f += c;
  }
  if (f || cur.length) { cur.push(f); rows.push(cur); }
  rows = rows.filter(function (r) { return r.some(function (x) { return String(x).trim(); }); });
  if (!rows.length) return [];
  var h = rows[0].map(function (x) { return String(x).toLowerCase().trim(); });
  var col = function (re) { for (var k = 0; k < h.length; k++) if (re.test(h[k])) return k; return -1; };
  var cD = col(/tanggal|tgl|date/), cK = col(/keterangan|berita|uraian|deskripsi|description|remark/), cC = col(/kredit|credit|masuk|^cr$/), cA = col(/jumlah|nominal|amount|mutasi/), cR = col(/referensi|reference|ref|no\.? ?transaksi/), cT = col(/^(db\/cr|d\/k|tipe|type)$/);
  return rows.slice(1).map(function (r) {
    var amt = cC >= 0 ? r[cC] : (cA >= 0 ? r[cA] : '');
    if (cC < 0 && cT >= 0 && /^(d|db|debit)$/i.test(String(r[cT]).trim())) amt = '-' + amt;
    if (cC < 0 && /\bDB\b/i.test(String(amt))) amt = '-' + amt;
    return { date: cD >= 0 ? r[cD] : '', description: cK >= 0 ? r[cK] : r.join(' '), amount: String(amt || '').replace(/\s|CR/gi, ''), reference: cR >= 0 ? r[cR] : '' };
  }).filter(function (x) { return x.amount; });
}
document.addEventListener('change', function (e) {
  if (e.target.id !== 'bankFile') return;
  var f = e.target.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    BANK.rows = parseCsv(String(rd.result)); BANK.res = null;
    if (!BANK.rows.length) return toast('Tidak ada baris mutasi yang dikenali.', 'err');
    call('bank.match', { projectId: S.projectId, rows: BANK.rows }).then(function (r) { BANK.res = r; rerenderBody(); }).catch(function (er) { toast(errMsg(er), 'err'); });
  };
  rd.readAsText(f);
});
ACT['bank-reset'] = function () { BANK.rows = []; BANK.res = null; rerenderBody(); };
ACT['bank-apply'] = function (el) {
  var pick = $$('.bankPick').filter(function (c) { return c.checked; }).map(function (c) { return BANK.res[Number(c.value)]; });
  if (!pick.length) return toast('Pilih minimal satu pasangan.', 'err');
  el.disabled = true;
  call('bank.apply', { projectId: S.projectId, notifyCustomer: $('#bankNotify').checked, items: pick.map(function (r) { return { invoiceId: r.match.invoiceId, amount: r.amount, reference: r.reference, reason: r.reason, method: /KPR/i.test(r.match.label || '') ? 'ESCROW_KPR' : 'BANK_TRANSFER' }; }) }, null, { refresh: S.projectId })
    .then(function (r) { BANK.rows = []; BANK.res = null; toast(r.posted.length + ' pembayaran dibukukan & direkonsiliasi.', 'ok'); if (S.lastBoot) { var b = S.lastBoot; S.lastBoot = null; applyBoot(b); } else refresh(); })
    .catch(function (e) { el.disabled = false; toast(errMsg(e), 'err'); });
};

boot();
</script>
